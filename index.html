<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dla Ciebie, Natalcia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #241733;
    --bg-deep2: #150e20;
    --rose: #e8a9c4;
    --gold: #f0c87e;
    --cream: #fbf4e9;
    --lavender: #c9b6e8;
    --text-muted: rgba(251,244,233,0.62);
    --seal-size: 132px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body{
    background: radial-gradient(ellipse at 50% 15%, #33224a 0%, var(--bg-deep) 45%, var(--bg-deep2) 100%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 32px 20px;
  }

  /* ambient fireflies */
  .fireflies{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .firefly{
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px 2px rgba(240,200,126,0.7);
    opacity: 0;
    animation: drift 9s ease-in-out infinite;
  }
  @keyframes drift{
    0%   { opacity: 0; transform: translate(0,0) scale(0.8); }
    15%  { opacity: 0.9; }
    50%  { transform: translate(var(--dx,30px), var(--dy,-60px)) scale(1); }
    85%  { opacity: 0.7; }
    100% { opacity: 0; transform: translate(var(--dx2,-20px), var(--dy2,-120px)) scale(0.6); }
  }

  main{
    position: relative;
    z-index: 1;
    max-width: 640px;
    width: 100%;
    text-align: center;
  }

  .eyebrow{
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--lavender);
    margin: 0 0 18px;
    opacity: 0.85;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.4rem, 7vw, 4rem);
    line-height: 1.08;
    margin: 0 0 8px;
    color: var(--cream);
  }

  h1 .name{
    display: block;
    background: linear-gradient(90deg, var(--gold), var(--rose));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub{
    font-size: 15.5px;
    color: var(--text-muted);
    max-width: 420px;
    margin: 0 auto 56px;
    line-height: 1.6;
  }

  /* ---- Wax seal button ---- */
  .seal-wrap{
    position: relative;
    width: var(--seal-size);
    height: var(--seal-size);
    margin: 0 auto;
  }

  .seal{
    all: unset;
    cursor: pointer;
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f6d597, var(--gold) 45%, #c98a55 100%);
    box-shadow:
      0 0 0 5px rgba(240,200,126,0.12),
      0 10px 30px rgba(0,0,0,0.45),
      inset 0 -6px 12px rgba(0,0,0,0.25),
      inset 0 4px 10px rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .seal:hover{
    transform: scale(1.04);
    box-shadow:
      0 0 0 7px rgba(240,200,126,0.18),
      0 14px 34px rgba(0,0,0,0.5),
      inset 0 -6px 12px rgba(0,0,0,0.25),
      inset 0 4px 10px rgba(255,255,255,0.4);
  }
  .seal:focus-visible{
    outline: 3px solid var(--cream);
    outline-offset: 5px;
  }
  .seal .monogram{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 44px;
    color: #6b3d1f;
    text-shadow: 0 1px 0 rgba(255,255,255,0.25);
  }

  .seal-hint{
    margin-top: 18px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* crack halves shown at click, then fly apart */
  .crack{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }
  .crack::before, .crack::after{
    content: '';
    position: absolute;
    top: -10%;
    width: 60%;
    height: 120%;
    background: radial-gradient(circle at 35% 30%, #f6d597, var(--gold) 45%, #c98a55 100%);
  }
  .crack::before{ left: -5%; border-radius: 50% 0 0 50% / 50% 50% 50% 50%; }
  .crack::after{ right: -5%; border-radius: 0 50% 50% 0 / 50% 50% 50% 50%; }

  .seal-wrap.opening .crack::before{
    animation: crackLeft 0.7s ease forwards;
  }
  .seal-wrap.opening .crack::after{
    animation: crackRight 0.7s ease forwards;
  }
  .seal-wrap.opening .seal{
    animation: sealFade 0.6s ease forwards 0.15s;
  }
  @keyframes crackLeft{
    to{ transform: translate(-70px, 40px) rotate(-25deg); opacity: 0; }
  }
  @keyframes crackRight{
    to{ transform: translate(70px, 40px) rotate(25deg); opacity: 0; }
  }
  @keyframes sealFade{
    to{ opacity: 0; transform: scale(0.9); }
  }

  .seal-wrap.hidden-away{
    display: none;
  }

  /* spark burst */
  .spark{
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    left: 50%;
    top: 50%;
    opacity: 0;
  }

  /* ---- Reveal (message + video) ---- */
  .reveal{
    margin-top: 40px;
    opacity: 0;
    transform: translateY(14px) scale(0.98);
    transition: opacity 0.7s ease, transform 0.7s ease;
    pointer-events: none;
  }
  .reveal.show{
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .message{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    color: var(--cream);
    max-width: 480px;
    margin: 0 auto 26px;
    line-height: 1.55;
  }

  .video-frame{
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    border-radius: 16px;
    padding: 8px;
    background: linear-gradient(160deg, rgba(240,200,126,0.35), rgba(232,169,196,0.25));
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .video-inner{
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 11px;
    overflow: hidden;
    background: #000;
  }
  .video-inner iframe{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .signoff{
    margin-top: 22px;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  @media (prefers-reduced-motion: reduce){
    .firefly, .seal, .crack::before, .crack::after{
      animation: none !important;
    }
    .reveal{ transition: opacity 0.3s ease; }
  }

  @media (max-width: 420px){
    :root{ --seal-size: 108px; }
    .seal .monogram{ font-size: 36px; }
  }
</style>
</head>
<body>

<div class="fireflies" id="fireflies" aria-hidden="true"></div>

<main>
  <p class="eyebrow">specjalnie dla Ciebie</p>
  <h1>Dla Ciebie,<span class="name">Natalcia</span></h1>
  <p class="sub">Mam nadzieję, że się spodoba</p>

  <div class="seal-wrap" id="sealWrap">
    <button class="seal" id="sealBtn" aria-label="Otwórz niespodziankę od Natalcia">
      <span class="monogram">N</span>
    </button>
    <div class="crack" id="crack" aria-hidden="true"></div>
  </div>
  <p class="seal-hint" id="hint">kliknij przycisk!</p>

  <div class="reveal" id="reveal">
    <p class="message">Nagrałem to, myśląc o Tobie. Mam nadzieję dostarczy Ci duuużo uśmiechu.</p>
    <div class="video-frame">
      <div class="video-inner" id="videoInner"></div>
    </div>
    <p class="signoff">z całego serca 🤎</p>
  </div>
</main>

<script>
  // ambient fireflies
  const fContainer = document.getElementById('fireflies');
  const count = window.innerWidth < 480 ? 10 : 18;
  for (let i = 0; i < count; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    const startX = Math.random() * 100;
    const startY = 60 + Math.random() * 40;
    f.style.left = startX + 'vw';
    f.style.top = startY + 'vh';
    f.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    f.style.setProperty('--dy', (-60 - Math.random() * 80) + 'px');
    f.style.setProperty('--dx2', (Math.random() * 100 - 50) + 'px');
    f.style.setProperty('--dy2', (-150 - Math.random() * 100) + 'px');
    f.style.animationDelay = (Math.random() * 9) + 's';
    f.style.animationDuration = (7 + Math.random() * 5) + 's';
    fContainer.appendChild(f);
  }

  const sealWrap = document.getElementById('sealWrap');
  const sealBtn = document.getElementById('sealBtn');
  const crackEl = document.getElementById('crack');
  const hint = document.getElementById('hint');
  const reveal = document.getElementById('reveal');
  const videoInner = document.getElementById('videoInner');

  const VIDEO_ID = 'v35HY8jqQsY';

  function spawnSparks(){
    for (let i = 0; i < 14; i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const angle = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 60;
      s.style.setProperty('--x', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--y', Math.sin(angle) * dist + 'px');
      s.style.animation = `sparkFly ${0.6 + Math.random()*0.4}s ease-out forwards`;
      s.style.left = '50%';
      s.style.top = '50%';
      sealWrap.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  }

  const styleSheet = document.createElement('style');
  styleSheet.textContent = `
    @keyframes sparkFly {
      0% { transform: translate(-50%,-50%) translate(0,0); opacity: 1; }
      100% { transform: translate(-50%,-50%) translate(var(--x), var(--y)); opacity: 0; }
    }
  `;
  document.head.appendChild(styleSheet);

  let opened = false;
  sealBtn.addEventListener('click', () => {
    if (opened) return;
    opened = true;

    sealWrap.classList.add('opening');
    hint.style.transition = 'opacity 0.4s ease';
    hint.style.opacity = '0';
    spawnSparks();

    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${VIDEO_ID}?rel=0&autoplay=1`;
    iframe.title = 'Film dla Natalcia';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    videoInner.appendChild(iframe);

    setTimeout(() => {
      sealWrap.classList.add('hidden-away');
      reveal.classList.add('show');
    }, 650);
  });
</script>

</body>
</html>
